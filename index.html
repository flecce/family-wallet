<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F4F5FA" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F0E1A" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Spese di famiglia condivise su Google Sheets o Excel: chi ha pagato, chi deve dare a chi.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Family Wallet">
    <title>Family Wallet</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
      // tema scelto dall'utente, applicato prima del primo disegno (evita il lampo di colore sbagliato)
      try {
        const t = localStorage.getItem("fw.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <script src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main id="app" class="app">
      <div class="splash">
        <img class="splash-logo" src="icon.svg" alt="Family Wallet" width="96" height="96">
        <span class="spinner"></span>
      </div>
    </main>
    <noscript>Family Wallet ha bisogno di JavaScript.</noscript>
  </body>
</html>
