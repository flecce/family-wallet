<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona "maskable" per Android: il sistema la ritaglia a cerchio (o altre forme) e garantisce
       visibile solo il cerchio centrale (80% del lato). Solo le iniziali "fw", ben dentro la zona sicura. -->
  <defs>
    <linearGradient id="fw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#4A2BE0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fw-bg)"/>
  <g transform="translate(256 262) translate(-268 -273)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M174 262H236M204 370V236c0-42 22-62 60-60" stroke-width="34"/>
    <path d="M250 258 278 350 306 280 334 350 362 258" stroke-width="32"/>
  </g>
  <circle cx="280" cy="165" r="20" fill="#C6F36B"/>
</svg>
