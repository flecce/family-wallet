name: Rilascio su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test
        run: npm test

      - name: Build con file hashati
        run: npm run build
        env:
          # Facoltativo: se definite in Settings > Secrets and variables > Actions > Variables,
          # sostituiscono i valori di js/config.js
          FW_GOOGLE_CLIENT_ID: ${{ vars.FW_GOOGLE_CLIENT_ID }}
          FW_MICROSOFT_CLIENT_ID: ${{ vars.FW_MICROSOFT_CLIENT_ID }}
          FW_PUSH_WORKER_URL: ${{ vars.FW_PUSH_WORKER_URL }}
          FW_VAPID_PUBLIC_KEY: ${{ vars.FW_VAPID_PUBLIC_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
